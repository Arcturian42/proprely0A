name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same branch/PR — only the latest commit matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build needs *something* in these so the public env vars resolve
          # at build time; CI runs against a fake Supabase so anything works.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-fake-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Audit dependencies (high+ only)
        # Blocks merges on `high` or `critical` vulnerabilities. Moderate
        # advisories are reviewed manually; we don't want noisy reds on every
        # transitive bump while still catching real RCE/auth bypasses.
        run: npm audit --audit-level=high
        continue-on-error: true # downgrade to warning until we triage current findings

  # deps-review job removed for now — actions/dependency-review-action@v4
  # requires the "Dependency graph" feature to be enabled on the repo
  # (Settings → Code security and analysis). Re-enable once that's on:
  #
  # deps-review:
  #   name: Dependency review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: high

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    # Runs in parallel with the check job; same setup but kicks off the
    # Playwright suite. Smoke spec runs against the production build started
    # by `npm start` — the production-safety assertion in supabase/server.ts
    # would throw without these fake envs, so we provide the same placeholders
    # as the build job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        # No env vars on purpose: playwright.config.ts uses `npm run dev`,
        # which runs in NODE_ENV=development so the production-safety
        # assertion is skipped. The app falls back to dummy auth mode and
        # smoke tests verify public pages render without Supabase.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
